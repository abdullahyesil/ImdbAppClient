<h2 mat-dialog-title>IMdb Giriş</h2>
<mat-dialog-content class="mat-typography">
    <form *ngIf="!loading" #authForm="ngForm" (ngSubmit)="onSubmit(authForm)">
        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" required email="" ngModel name="email" id="email" class="form-control">
        </div>
    
        <div class="mb-3">
            <label for="password" class="form-label">Password:</label>
            <input type="password" required minlength="6" ngModel name="password" id="password" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="authForm.invalid"> Giriş Yap</button>
      
    </form>
    <app-loading *ngIf="loading"></app-loading> 
    <div *ngIf="error" class="alert alert-danger">
        {{error}}
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>

</mat-dialog-actions>
