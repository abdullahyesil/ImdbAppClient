<div class="container my-3">
    <div class="row">
      <div class="col-md-3">
        <app-menu></app-menu>
      </div>
      <div class="col-md-9">
    <div class="container mt-4">
        <select class="form-select" [(ngModel)]="selectedStatus" (ngModelChange)="filterComments($event)" aria-label="Default select example">
            <option [ngValue]="null">Hepsini Göster</option>
            <option [ngValue]="false">Onay Bekleyenler</option>
            <option [ngValue]="true">Onaylı Yorumlar</option>
          </select>

        <div *ngFor="let comment of comments" class="card mb-3 mt-2">
          <div class="card-header">
            Kullanıcı ID: {{comment.userId}}
            <span class="float-right">{{comment.commentedOn| date:'short'}}</span>

            <span *ngIf="!comment.isApproved" class=" float-left text-bg-warning"> Onay Bekliyor</span>
            <span *ngIf="comment.isApproved" class=" float-left text-bg-success"> Onaylandı</span>
          </div>
          <div class="card-body">
            <p class="card-text">{{comment.content}}</p>
          </div>
          <div class="card-footer text-right">
            <button class="btn btn-success btn-sm m-2" (click)="approvedComment(comment.id)">Onayla</button>
            <button class="btn btn-danger btn-sm m-2" (click)="deleteComment(comment)">Sil</button>
          </div>
        </div>
      </div>

      <p-paginator *ngIf="comments.length > rows "
      (onPageChange)="onPageChange($event)" 
      [first]="first"
      [rows]="rows" 
      [totalRecords]="totalCount" 
      [rowsPerPageOptions]="[10, 20, 30]" />
    </div>
    
      
  </div>
  
      </div>
